<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROOM101</title>
  <link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
background: #000;

      color: white;
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
     animation: roomEnter 0.8s ease-out;
    }
    .room {
      font-size: 13px;
      letter-spacing: 6px;
      color: #777;
      margin-bottom: 25px;
    }

    .profile {
      width: 120px;
      height: 120px;
      margin: auto;
      border-radius: 50%;
      overflow: hidden;
      background: #111;
      border: 2px solid #333;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 35px;
      font-weight: bold;

      margin-bottom: 20px;
   transition: transform 0.3s ease, border-color 0.3s ease;
    } 
.profile:hover {
    transform: scale(1.06);
    border-color: #fff;
}
    .profile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}
    h1 {font-family: Georgia, serif;
font-weight: 600;
letter-spacing: 3px;
color: #d6d6d6;
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    .bio {
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .links {
      display: grid;
grid-template-columns: 1fr;      gap: 12px;
    }

    .links a {
      text-decoration: none;
      color: white;

      background: rgba(255,255,255,0.05);
      border: 1px solid #252525;

      padding: 16px;
      border-radius: 10px;

      transition: 0.25s;
    }

    .links a:hover {
    background: white;
    color: black;
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 8px 25px rgba(255,255,255,0.15);
} 
     

    .about {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid #222;
    }

    .about h2 {
      font-size: 13px;
      letter-spacing: 4px;
      color: #777;
      margin-bottom: 15px;
    }

    .about p {
      color: #aaa;
      line-height: 1.7;
    }

    footer {
      margin-top: 50px;
      color: #444;
      font-size: 12px;
      letter-spacing: 2px;
    }

    @media (max-width: 500px) {
      .links {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 32px;
      }
    }
 @keyframes roomEnter {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
   </style>
</head>


<body>

  <main class="container">

    <div class="room">
      ROOM101
    </div>

    <div class="profile">
  <img src="unnamed.jpg" alt="Cam">
</div>

    <h1>Social Links</h1>

  <div class="subtitle">
    IT 
    <br>
    Dayton Ohio
</div>

 


    <div class="links">

  <a href="https://www.instagram.com/mobhunav/" target="_blank" rel="noopener noreferrer"> <i class="fa-brands fa-instagram"></i> Instagram
    </a>

    <a href="https://www.tiktok.com/@m1unna" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-tiktok"></i> TikTok
    </a>

    <a href="https://www.twitch.tv/m2unna" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-twitch"></i> Twitch
    </a>

</div>


    <section class="about">

      <h2>ABOUT</h2>

      <p>
       <p>
    Just something I made to keep everything in one place.
</p>
      </p>

    </section>


    <footer>
      ROOM101 • 2026
    </footer>

  </main>

</body>

</html>
